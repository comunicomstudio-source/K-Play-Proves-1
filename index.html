<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K-PLAY</title>
<style>
  html,body{margin:0;height:100%;background:#07030f;overflow:hidden;
    font-family:"Courier New",monospace;color:#fff7fb;}
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;}
  canvas{image-rendering:pixelated;background:#07030f;
    box-shadow:0 0 0 3px #2a1a5e,0 0 44px rgba(255,61,119,.35);}
  #bar{display:flex;gap:14px;align-items:center;font-size:12px;color:#b9a6ea;flex-wrap:wrap;justify-content:center}
  label{cursor:pointer}
  #hint{font-size:11px;color:#8a73c8;letter-spacing:1px;text-align:center}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="480" height="270"></canvas>
  <div id="bar">
    <label>Volumen <input id="vol" type="range" min="0" max="100" value="55"></label>
    <label><input id="mute" type="checkbox"> Silencio</label>
    <label>Musica de fondo propia: <input id="bgfile" type="file" accept="audio/*"></label>
  </div>
  <div id="hint">Flechas / A D mover · ↑ W Espacio saltar (doble salto) · J disparar · ↓ entrar portal · P pausa · R renombra en SELECCION · cada 100 ★ cae un 1UP · ♪ cada nota esconde una melodia · al final: ¡EL GRAN SAJA!</div>
</div>
<script>
(()=>{
"use strict";
const cv=document.getElementById("c"), ctx=cv.getContext("2d");
const W=480,H=270;
ctx.imageSmoothingEnabled=false;
/* escalado entero, tope x4 = 1920x1080 */
function resize(){const s=Math.min(4,Math.max(1,Math.floor(Math.min(window.innerWidth/W,window.innerHeight/H))));
  cv.style.width=(W*s)+"px";cv.style.height=(H*s)+"px";}
window.addEventListener("resize",resize);resize();

/* ====== guardado ====== */
const SKEY="kplay_save_v4";
function loadSave(){try{const r=localStorage.getItem(SKEY);if(r)return JSON.parse(r);}catch(e){}return null;}
function persist(){try{localStorage.setItem(SKEY,JSON.stringify(save));}catch(e){}}
const DEFNAMES=["AURA","NOVA","VELA","RUBI","IRIS","KORA","MILA","ZARA","LYRA"];
let save=loadSave()||{names:DEFNAMES.slice(),vol:0.55,muted:false,best:0,lastIdol:0};
if(!save.names||save.names.length!==9)save.names=DEFNAMES.slice();

/* ====== entrada ====== */
const keys={};let renaming=false,nameBuf="";
addEventListener("keydown",e=>{
  if(renaming){handleRename(e);e.preventDefault();return;}
  keys[e.code]=true;
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code))e.preventDefault();
  if(e.code==="KeyP"&&state==="play")paused=!paused;
});
addEventListener("keyup",e=>{keys[e.code]=false;});
const pr=a=>a.some(k=>keys[k]);

/* ====== audio: chiptune original ====== */
let actx=null,master=null,noise=null;
function initAudio(){
  if(actx)return;
  try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  master=actx.createGain();master.gain.value=save.muted?0:save.vol;master.connect(actx.destination);
  const len=Math.floor(actx.sampleRate*0.4),buf=actx.createBuffer(1,len,actx.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;noise=buf;
}
function setVol(){if(master)master.gain.value=save.muted?0:save.vol;}
function blip(freq,dur,type,vol,when){
  if(!actx)return;const t=actx.currentTime+when;
  const o=actx.createOscillator(),g=actx.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(master);o.start(t);o.stop(t+dur+0.02);
}
function kick(when){if(!actx)return;const t=actx.currentTime+when;
  const o=actx.createOscillator(),g=actx.createGain();o.type="sine";
  o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+0.12);
  g.gain.setValueAtTime(0.22,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.14);
  o.connect(g).connect(master);o.start(t);o.stop(t+0.16);}
function hat(when){if(!actx||!noise)return;const t=actx.currentTime+when;
  const s=actx.createBufferSource();s.buffer=noise;const f=actx.createBiquadFilter();
  f.type="highpass";f.frequency.value=7000;const g=actx.createGain();
  g.gain.setValueAtTime(0.05,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.04);
  s.connect(f).connect(g).connect(master);s.start(t);s.stop(t+0.05);}

/* frases melodicas originales de sabor K-pop (ninguna es de un tema real) */
const MEL=[
  [0,4,7,12,9,7,9,12],
  [12,9,11,7,9,4,7,0],
  [4,7,9,12,9,14,12,16],
  [7,12,11,9,11,12,14,16],
  [0,3,7,10,7,3,10,12],
  [12,14,16,12,9,11,12,7]
];
const PROG=[[5,9,12],[3,7,10],[0,4,7],[7,11,14]];
const LEADS=[[0,2,4,7,4,2,0,4],[7,4,2,0,2,4,7,9],[0,4,7,4,5,4,2,0],[4,7,9,7,4,2,0,2]];
let mus={on:false,step:0,next:0,base:0,bpm:128};
function startMusic(base,bpm){mus.on=true;mus.step=0;mus.base=base;mus.bpm=bpm;mus.next=actx?actx.currentTime+0.05:0;}
function stopMusic(){mus.on=false;}
function nf(semi){return 261.63*Math.pow(2,semi/12);}
function musTick(){
  if(!actx||!mus.on||paused)return;
  const spb=60/mus.bpm/2;
  while(mus.next<actx.currentTime+0.1){
    const s=mus.step%8,bar=Math.floor(mus.step/8)%4,w=mus.next-actx.currentTime,chord=PROG[bar];
    if(s%2===0)blip(nf(mus.base+chord[0]-12),spb*1.8,"triangle",0.10,w);
    blip(nf(mus.base+12+LEADS[bar][s]),spb*0.9,"square",0.07,w);
    if(s%2===1)blip(nf(mus.base+chord[s%3]),spb*0.5,"square",0.04,w);
    if(s===0||s===4)kick(w);
    hat(w);
    mus.step++;mus.next+=spb;
  }
}
const sfx={
  jump(){blip(520,0.10,"square",0.10,0);blip(760,0.09,"square",0.07,0.04);},
  jump2(){blip(680,0.09,"square",0.08,0);blip(980,0.08,"square",0.06,0.04);},
  shoot(){blip(880,0.05,"square",0.07,0);blip(1250,0.05,"square",0.05,0.03);},
  eshoot(){blip(340,0.08,"sawtooth",0.05,0);},
  stomp(){blip(300,0.07,"square",0.10,0);blip(150,0.12,"sawtooth",0.07,0.04);},
  coin(){blip(900,0.05,"square",0.08,0);blip(1350,0.10,"square",0.08,0.05);},
  life(){[0,4,7,12].forEach((s,i)=>blip(nf(12+s),0.12,"square",0.10,i*0.10));},
  hit(){blip(200,0.18,"sawtooth",0.12,0);blip(110,0.22,"sawtooth",0.09,0.05);},
  win(){[0,4,7,12,16,19].forEach((s,i)=>blip(nf(s),0.13,"square",0.10,i*0.10));},
  portal(){blip(400,0.1,"sine",0.08,0);blip(700,0.1,"sine",0.07,0.06);blip(1000,0.12,"sine",0.06,0.12);},
  roar(){blip(95,0.5,"sawtooth",0.14,0);blip(70,0.6,"sawtooth",0.10,0.1);},
  sad(){[7,3,0,-5].forEach((s,i)=>blip(nf(s),0.30,"triangle",0.11,0.2+i*0.22));},
  melody(i){MEL[i%MEL.length].forEach((s,k)=>{blip(nf(12+s),0.15,"square",0.10,k*0.115);blip(nf(s),0.15,"triangle",0.05,k*0.115);});},
  thud(){kick(0);blip(80,0.12,"square",0.08,0);},
  bosshit(){blip(240,0.12,"sawtooth",0.11,0);blip(480,0.08,"square",0.07,0.04);},
  crumble(){blip(190,0.10,"sawtooth",0.06,0);blip(120,0.12,"sawtooth",0.05,0.05);},
  check(){blip(700,0.08,"square",0.08,0);blip(1050,0.12,"square",0.08,0.07);}
};

/* cargador neutro de audio de fondo (reproduce el archivo tal cual) */
let bgAudio=null;
document.getElementById("bgfile").addEventListener("change",e=>{
  const f=e.target.files[0];if(!f)return;
  if(bgAudio)bgAudio.pause();
  bgAudio=new Audio(URL.createObjectURL(f));bgAudio.loop=true;bgAudio.volume=save.muted?0:save.vol;
  bgAudio.play().catch(()=>{});
});

/* ====== idols originales ====== */
const PAL=[
  {hair:"#ff7ab0",out:"#ff3d77",acc:"#ffd23f"},{hair:"#34e3ff",out:"#1f9bd1",acc:"#ffffff"},
  {hair:"#c9a0ff",out:"#7b3ff2",acc:"#34e3ff"},{hair:"#ff5a5a",out:"#c2293f",acc:"#ffd23f"},
  {hair:"#5ef2a0",out:"#1fbf6b",acc:"#ffd23f"},{hair:"#ffd23f",out:"#ff9f1c",acc:"#ff3d77"},
  {hair:"#a0e0ff",out:"#3a6df0",acc:"#ffffff"},{hair:"#ff9ad5",out:"#d63bb0",acc:"#ffe08a"},
  {hair:"#b6ff5e",out:"#6fae1f",acc:"#34e3ff"}
];
function idol(i){const p=PAL[i];return{i,name:save.names[i],hair:p.hair,out:p.out,acc:p.acc,
  move:1.7+((i%3)*0.12),jump:-7.4-((i%3===2)?0.5:0),fire:i%3===0?12:16,proj:3.6+((i%3===1)?0.6:0)};}
const SKIN="#ffd9b8",EYE="#241038",LEG="#2a1a4a";
/* animacion por estados: cuerpo comun + piernas por pose */
const BODY=["....HHHH....","...HHWHHH...","..HHHHHHHH..","..HSSSSSSH..","..HSESSESH..",
"..HSSSSSSH..","...SSSSSS...","..AOOOOOOA..",".SOOOOOOOOS.",".SOOOOOOOOS.",
"..OAAAAAAO..","...OOOOOO..."];
const LEGS={
  idle:["...OO..OO...","...LL..LL...","...LL..LL...","...LL..LL..."],
  run1:["...OO..OO...","..LL....LL..",".LL......LL.",".L........L."],
  run2:["...OO..OO...","....LLLL....","....LLLL....","...LL..LL..."],
  jump:["...OO..OO...","..LL...LL...","..L......L..","............"],
  fall:["..OO....OO..",".LL......LL.",".L........L.","............"]
};
function spriteRows(pose,t){
  const b=BODY.slice();
  if(pose==="idle"&&(t%140)<8)b[4]="..HSSSSSSH..";   /* parpadeo */
  if(pose==="run")return b.concat(t%2?LEGS.run1:LEGS.run2);
  return b.concat(LEGS[pose]||LEGS.idle);
}
function drawIdol(x,y,d,faceLeft,scale,rows){
  scale=scale||1;rows=rows||spriteRows("idle",blink+d.i*17);
  const m={H:d.hair,S:SKIN,E:EYE,A:d.acc,O:d.out,L:LEG,W:"#fff7fb"};
  for(let r=0;r<rows.length;r++){const row=rows[r];
    for(let c=0;c<row.length;c++){const ch=row[c];if(ch===".")continue;const col=m[ch];if(!col)continue;
      const px=faceLeft?(row.length-1-c):c;ctx.fillStyle=col;
      ctx.fillRect(Math.round(x+px*scale),Math.round(y+r*scale),Math.ceil(scale),Math.ceil(scale));}}
}

/* ====== rng determinista ====== */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}
const GROUND=242;

/* ====== fondo: ciudad neon con parallax (3 capas + cielo) ====== */
const BGS=(()=>{const r=mulberry32(2025);
  const far=[],mid=[],near=[];let x=0;
  while(x<940){const w=30+Math.floor(r()*52),h=52+Math.floor(r()*92);
    far.push({x,w,h,ant:r()<0.35});x+=w+4+Math.floor(r()*18);}
  x=0;
  while(x<920){const w=48+Math.floor(r()*62),h=84+Math.floor(r()*108),win=[];
    for(let wy=8;wy<h-10;wy+=10)for(let wx=5;wx<w-7;wx+=9)
      if(r()<0.45)win.push({wx,wy,c:r()<0.5?0:1,bl:r()<0.18});
    mid.push({x,w,h,win,sign:r()<0.4?{c:r()<0.5?0:1,sy:12+Math.floor(r()*26),sh:18+Math.floor(r()*16)}:null});
    x+=w+12+Math.floor(r()*28);}
  x=0;
  while(x<900){const w=64+Math.floor(r()*86),h=22+Math.floor(r()*22);
    near.push({x,w,h,neon:r()<0.6?(r()<0.5?0:1):-1});x+=w+18+Math.floor(r()*44);}
  return{far,mid,near};})();
const NEON=["#ff3d77","#34e3ff"];
function layer(arr,f,fn){const Pw=960;const o=-(((cam*f)%Pw+Pw)%Pw);
  for(let rep=0;rep<3;rep++){const base=o+rep*Pw;
    for(const b of arr){const sx=base+b.x;if(sx>W||sx+b.w<0)continue;fn(b,sx);}}}
function hexRGB(h){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255];}
function mix(a,b,t){const A=hexRGB(a),B=hexRGB(b);return"rgb("+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(",")+")";}
function grad(a,b){const N=6,bh=Math.ceil(H/N);for(let i=0;i<N;i++){ctx.fillStyle=mix(a,b,i/(N-1));ctx.fillRect(0,i*bh,W,bh);}}
function bgStars(seed){ctx.fillStyle="rgba(255,255,255,.55)";for(let i=0;i<70;i++){const x=(i*71+seed*13)%W,y=(i*37+seed*7)%(H*0.55);if((i+seed)%3===0)ctx.fillRect(x,y,1,1);}}
function drawBG(){
  const bossOn=boss&&!boss.dead;
  if(lv&&lv.bonus)grad("#0f2d3a","#04121a");
  else if(bossOn)grad("#3a0f2a","#0c0312");
  else grad("#241a52","#0c0726");
  bgStars(3);
  /* luna */
  const mx=W-86,my=44,mc=bossOn?"#ff5a5a":"#ffd9ec";
  ctx.fillStyle=mc;
  ctx.fillRect(mx-10,my-6,20,12);ctx.fillRect(mx-6,my-10,12,20);ctx.fillRect(mx-8,my-8,16,16);
  ctx.fillStyle="rgba(7,3,15,.25)";ctx.fillRect(mx-4,my-2,4,4);ctx.fillRect(mx+2,my+3,3,3);
  /* nubes pixeladas a la deriva */
  for(let i=0;i<5;i++){const sp=0.12+(i%3)*0.07,
    cx=(((i*173-blink*sp)%(W+140))+(W+140))%(W+140)-70,cy=26+i*15;
    ctx.fillStyle="rgba(185,166,234,.10)";
    ctx.fillRect(cx,cy,72,7);ctx.fillRect(cx+12,cy-5,46,5);ctx.fillRect(cx+26,cy+7,34,4);}
  /* capa lejana: siluetas */
  layer(BGS.far,0.15,(b,sx)=>{
    ctx.fillStyle="#150b2e";ctx.fillRect(sx,GROUND-58-b.h,b.w,b.h+58);
    if(b.ant){ctx.fillRect(sx+(b.w>>1),GROUND-58-b.h-9,1,9);
      if(Math.floor(blink/30)%2){ctx.fillStyle="#ff5a5a";ctx.fillRect(sx+(b.w>>1)-1,GROUND-58-b.h-11,2,2);}}});
  /* capa media: edificios con ventanas y carteles neon */
  layer(BGS.mid,0.35,(b,sx)=>{
    ctx.fillStyle="#1f1444";ctx.fillRect(sx,GROUND-26-b.h,b.w,b.h+26);
    ctx.fillStyle="#160d36";ctx.fillRect(sx,GROUND-26-b.h,b.w,3);
    for(const wn of b.win){
      if(wn.bl&&Math.floor(blink/25+wn.wx)%2)continue;
      ctx.fillStyle=wn.c?"rgba(255,122,176,.38)":"rgba(52,227,255,.34)";
      ctx.fillRect(sx+wn.wx,GROUND-26-b.h+wn.wy,3,4);}
    if(b.sign){ctx.fillStyle=b.sign.c?"rgba(52,227,255,.5)":"rgba(255,61,119,.5)";
      ctx.fillRect(sx+b.w-4,GROUND-26-b.h+b.sign.sy,3,b.sign.sh);}});
  /* capa cercana: azoteas (apagadas para no confundirse con plataformas) */
  layer(BGS.near,0.6,(b,sx)=>{
    ctx.fillStyle="#1d1242";ctx.fillRect(sx,GROUND-b.h,b.w,b.h);
    ctx.fillStyle="#251a4e";ctx.fillRect(sx,GROUND-b.h,b.w,2);
    if(b.neon>=0){ctx.fillStyle=b.neon?"rgba(52,227,255,.28)":"rgba(255,61,119,.28)";
      ctx.fillRect(sx,GROUND-b.h-1,b.w,1);}});
  /* niebla baja */
  ctx.fillStyle="rgba(12,7,38,.4)";ctx.fillRect(0,GROUND-18,W,18);
}

/* ====== enemigos (todos pixel art original) ====== */
function walker(a,b){return{type:"w",x:a+4,y:GROUND-13,w:12,h:13,dir:1,minX:a,maxX:b,alive:true,t:0};}
function spiny(a,b){return{type:"s",x:a+4,y:GROUND-11,w:12,h:11,dir:1,minX:a,maxX:b,alive:true,t:0};}
function flyer(a,b,y0){return{type:"f",x:a+4,y:y0,y0,ph:0,dir:1,minX:a,maxX:b,w:12,h:10,alive:true,t:0};}
function turret(x){return{type:"t",x,y:GROUND-16,w:14,h:16,alive:true,hp:2,cd:80,t:0};}

/* ====== NIVEL 1 (hecho a mano) ====== */
const LEN1=2960;
function buildLevel1(){
  const plats=[],mov=[],ene=[],stars=[],items=[],spikes=[],crushers=[],walls=[],notes=[];
  const N=(x,y,m)=>notes.push({x,y,m,got:false});
  const G=(x,w)=>plats.push({x,y:GROUND,w,h:30});
  const F=(x,y,w,c)=>plats.push({x,y,w,h:8,c:c?1:0,ct:0,dead:0});
  const ST=(x,y)=>stars.push({x,y,got:false});
  const SROW=(x,n,y)=>{for(let i=0;i<n;i++)ST(x+i*16,y);};
  /* 1: calentamiento */
  G(0,300);ene.push(walker(160,280));SROW(110,3,GROUND-40);SROW(210,3,GROUND-14);
  N(266,GROUND-46,0);
  /* 2: primer salto */
  G(350,260);SROW(366,4,GROUND-14);F(430,196,54);SROW(436,3,182);ene.push(walker(470,600));
  /* 3: pinchos + puas (no pisable) */
  G(670,250);spikes.push({x:736,y:GROUND-8,w:48,h:8});F(716,188,56);SROW(722,3,174);
  ene.push(spiny(800,910));ST(860,GROUND-50);N(742,156,1);
  /* 4: torreta altavoz */
  G(970,210);ene.push(turret(1110));SROW(1000,3,GROUND-14);ST(1062,GROUND-52);ST(1150,GROUND-14);
  /* 5: plataforma movil, aplastador y portal bonus */
  mov.push({x:1192,y:GROUND-40,w:46,h:8,ax:0,ay:1,range:26,spd:0.8,bx:1192,by:GROUND-40,ph:0});
  N(1210,GROUND-86,2);
  G(1250,230);
  crushers.push({x:1320,y:118,w:26,h:24,y0:118,state:0,vy:0,t:90});
  SROW(1318,2,GROUND-14);ene.push(flyer(1370,1462,168));
  const portal={x:1432,y:GROUND-26,w:18,h:26};
  /* 6: puente que se desmorona sobre pinchos */
  G(1480,60);
  G(1540,132);spikes.push({x:1540,y:GROUND-8,w:132,h:8});
  F(1546,196,40,1);F(1590,196,40,1);F(1634,196,40,1);SROW(1556,3,178);
  G(1672,120);N(1716,GROUND-46,3);
  /* 7: 1UP escondido en alto */
  G(1840,210);ene.push(walker(1862,2040));F(1900,184,50);ST(1916,168);
  F(1936,138,40);items.push({type:"life",x:1952,y:124,got:false});
  SROW(1990,3,GROUND-14);
  /* 8: ultima defensa */
  G(2100,250);ene.push(flyer(2140,2300,160));ene.push(turret(2292));SROW(2150,4,GROUND-44);
  /* arena del jefe + puerta */
  G(2400,560);SROW(2450,5,GROUND-46);N(2560,GROUND-56,4);
  walls.push({x:2766,y:GROUND-74,w:12,h:74,gate:true});
  return {len:LEN1,plats,mov,ene,stars,items,spikes,crushers,walls,notes,portal,
    goal:2880,spawn:{x:24,y:200},checks:[{x:1500},{x:2418}],
    arena:{trig:2470,wallX:2404,bossX:2650,camX:2350}};
}
function genBonus(seed){
  const rng=mulberry32(seed*13+99),plats=[{x:0,y:GROUND,w:480,h:30}],stars=[];
  for(let i=0;i<14;i++)stars.push({x:24+i*31,y:GROUND-20-Math.floor(rng()*70),got:false});
  for(let i=0;i<3;i++)plats.push({x:70+i*140,y:GROUND-44-i*22,w:54,h:8});
  return {bonus:true,len:480,plats,mov:[],ene:[],stars,items:[],spikes:[],crushers:[],walls:[],
    notes:[{x:240,y:GROUND-64,m:5,got:false}],portal:null,
    goal:440,exit:{x:440,y:GROUND-26,w:18,h:26},spawn:{x:16,y:200},checks:[]};
}
function markStars(){const pre=lv.bonus?"b:":"l:";
  lv.stars.forEach((st,i)=>{st.k=pre+i;if(gotStars.has(st.k))st.got=true;});
  lv.notes.forEach((n,i)=>{n.k=pre+"n"+i;if(gotStars.has(n.k))n.got=true;});
  if(lifeGot)lv.items.forEach(it=>it.got=true);}

/* ====== estado ====== */
let state="title",paused=false,selIndex=save.lastIdol||0;
let lives=3,score=0,bonusReturn=null;
let lv=null,P=null,proj=[],eproj=[],parts=[],cam=0,flash=0,inv=0,blink=0,shake=0;
let starsCount=0,drops=[],gotStars=new Set(),lifeGot=false,maxX=0,boss=null,dying=0;
function spawnLifeDrop(){drops.push({x:Math.max(16,Math.min(P.x+24,lv.len-24)),y:-12,vy:0,w:9,h:9,active:true});}
function puff(x,y,n,col,sp){for(let i=0;i<n;i++)parts.push({x,y,
  vx:(Math.random()-0.5)*sp,vy:-Math.random()*sp*0.6,life:18+Math.random()*16,col});}
function newPlayer(spawn){const d=idol(selIndex);
  P={x:spawn.x,y:spawn.y,w:10,h:15,vx:0,vy:0,onGround:false,face:false,jumps:0,coyote:0,buf:0,jp:false,fire:0,d,stand:null,animT:0};}
function spawnPoint(){let s=lv.spawn;for(const c of lv.checks)if(maxX>=c.x+20)s={x:c.x,y:200};return s;}
function loadLevel(){lv=buildLevel1();markStars();proj=[];eproj=[];drops=[];parts=[];boss=null;cam=0;inv=40;
  newPlayer(spawnPoint());startMusic(0,124);}
function enterBonus(){bonusReturn={x:Math.min(P.x+30,lv.len-30),y:200};
  lv=genBonus(1);markStars();proj=[];eproj=[];drops=[];boss=null;cam=0;inv=20;newPlayer(lv.spawn);sfx.portal();}
function exitBonus(){const r=bonusReturn;bonusReturn=null;lv=buildLevel1();markStars();
  proj=[];eproj=[];drops=[];boss=null;cam=0;inv=20;newPlayer({x:r.x,y:r.y});}

/* ====== fisica ====== */
const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const solids=()=>lv.plats.filter(s=>!s.dead).concat(lv.mov,lv.walls);
function update(){
  if(state!=="play"||paused)return;
  if(dying>0){dying--;if(dying===0)afterDeath();return;}   /* pausa dramatica al morir */
  musTick();const d=P.d;blinkChecks();
  for(const m of lv.mov){m.ph+=m.spd*0.04;const ox=m.x,oy=m.y;
    m.x=m.bx+(m.ax?Math.sin(m.ph)*m.range:0);m.y=m.by+(m.ay?Math.sin(m.ph)*m.range:0);m.dx=m.x-ox;m.dy=m.y-oy;}
  if(P.stand&&P.stand.dx!==undefined){P.x+=P.stand.dx;P.y+=P.stand.dy;}
  let dir=0;if(pr(["ArrowLeft","KeyA"]))dir-=1;if(pr(["ArrowRight","KeyD"]))dir+=1;
  P.vx+=((dir*d.move)-P.vx)*0.28;if(Math.abs(P.vx)<0.04)P.vx=0;if(dir!==0)P.face=dir<0;
  P.animT+=Math.abs(P.vx);
  const jk=pr(["ArrowUp","KeyW","Space"]);
  if(jk&&!P.jp){P.buf=7;
    if(P.onGround||P.coyote>0){P.vy=d.jump;P.jumps=1;P.onGround=false;P.coyote=0;P.buf=0;sfx.jump();puff(P.x+5,P.y+15,3,"#b9a6ea",1.4);}
    else if(P.jumps<2){P.vy=d.jump*0.707;P.jumps=2;sfx.jump2();}}
  P.jp=jk;
  if(P.buf>0){P.buf--;if(P.onGround){P.vy=d.jump;P.jumps=1;P.onGround=false;P.buf=0;sfx.jump();}}
  if(P.fire>0)P.fire--;
  if(pr(["KeyJ","KeyX"])&&P.fire<=0){proj.push({x:P.face?P.x-3:P.x+P.w,y:P.y+6,vx:(P.face?-1:1)*d.proj,w:5,h:4,life:90});P.fire=d.fire;sfx.shoot();}
  P.vy+=0.5;if(P.vy>8)P.vy=8;
  const wasAir=!P.onGround;
  P.x+=P.vx;
  for(const s of solids()){if(overlap(P,s)){if(P.vx>0)P.x=s.x-P.w;else if(P.vx<0)P.x=s.x+s.w;P.vx=0;}}
  P.onGround=false;P.stand=null;P.y+=P.vy;
  for(const s of solids()){if(overlap(P,s)){
    if(P.vy>0){P.y=s.y-P.h;P.vy=0;P.onGround=true;P.jumps=0;P.stand=s;}
    else if(P.vy<0){P.y=s.y+s.h;P.vy=0;}}}
  if(P.onGround&&wasAir)puff(P.x+5,P.y+15,3,"#8a73c8",1.2);
  if(P.onGround)P.coyote=7;else if(P.coyote>0)P.coyote--;
  if(P.x<0)P.x=0;if(P.x+P.w>lv.len)P.x=lv.len-P.w;
  maxX=Math.max(maxX,P.x);
  if(P.y>H+20){loseLife();return;}
  if(inv>0)inv--;
  /* plataformas que se desmoronan */
  if(P.stand&&P.stand.c)P.stand.ct++;
  for(const s of lv.plats){if(!s.c)continue;
    if(s.dead>0){s.dead--;if(s.dead===0)s.ct=0;}
    else if(s.ct>40){s.dead=240;sfx.crumble();puff(s.x+s.w/2,s.y+4,6,"#5a3a9e",2);if(P.stand===s)P.stand=null;}}
  /* aplastadores: ciclo continuo e independiente del jugador */
  for(const c of lv.crushers){
    const near=Math.abs(P.x-c.x)<260;
    if(c.state===0){if(--c.t<=0){c.state=1;c.vy=0;}}
    else if(c.state===1){c.vy=Math.min(c.vy+0.5,6);c.y+=c.vy;
      if(c.y+c.h>=GROUND){c.y=GROUND-c.h;c.state=2;c.t=30;
        if(near){sfx.thud();shake=5;puff(c.x+c.w/2,GROUND,6,"#8a73c8",2.4);}}}
    else if(c.state===2){if(--c.t<=0)c.state=3;}
    else{c.y-=1.1;if(c.y<=c.y0){c.y=c.y0;c.state=0;c.t=70;}}
    if(inv<=0&&(c.state===1||c.state===2)&&overlap(P,c)){loseLife();return;}}
  /* pinchos */
  if(inv<=0)for(const sp of lv.spikes){if(overlap(P,sp)){loseLife();return;}}
  /* proyectiles del jugador */
  for(const p of proj){p.x+=p.vx;p.life--;}proj=proj.filter(p=>p.life>0);
  /* enemigos */
  for(const e of lv.ene){if(!e.alive)continue;e.t++;
    if(e.type==="w"){e.x+=e.dir*0.7;if(e.x<e.minX){e.x=e.minX;e.dir=1;}if(e.x+e.w>e.maxX){e.x=e.maxX-e.w;e.dir=-1;}}
    else if(e.type==="s"){e.x+=e.dir*0.5;if(e.x<e.minX){e.x=e.minX;e.dir=1;}if(e.x+e.w>e.maxX){e.x=e.maxX-e.w;e.dir=-1;}}
    else if(e.type==="f"){e.ph+=0.06;e.x+=e.dir*0.6;
      if(e.x<e.minX){e.x=e.minX;e.dir=1;}if(e.x+e.w>e.maxX){e.x=e.maxX-e.w;e.dir=-1;}
      e.y=e.y0+Math.sin(e.ph)*16;}
    else if(e.type==="t"){e.cd--;const dx=P.x-e.x;
      if(e.cd<=0&&Math.abs(dx)<250&&Math.abs(dx)>16){
        eproj.push({x:e.x+5,y:e.y+3,vx:Math.sign(dx)*1.5,vy:-1.9,g:0.07,w:5,h:5,life:200,note:1});
        e.cd=140;sfx.eshoot();}}
    for(const p of proj){if(overlap(p,e)){p.life=0;
      if(e.type==="t"){e.hp--;puff(e.x+7,e.y+6,4,"#34e3ff",2);if(e.hp<=0){e.alive=false;score+=25;puff(e.x+7,e.y+8,8,"#ff3d77",2.6);}}
      else{e.alive=false;score+=15;puff(e.x+6,e.y+6,8,e.type==="s"?"#b9c7e8":"#c9a0ff",2.4);}
      sfx.stomp();}}
    if(e.alive&&overlap(P,e)){
      const stompable=(e.type==="w"||e.type==="f");
      if(stompable&&P.vy>0&&P.y+P.h-P.vy<=e.y+4){e.alive=false;P.vy=-5;P.jumps=1;score+=15;sfx.stomp();puff(e.x+6,e.y+4,8,"#c9a0ff",2.4);}
      else if(inv<=0){loseLife();return;}}}
  /* proyectiles enemigos */
  for(const p of eproj){p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.life--;
    if(p.life<=0||p.y>H+20){p.life=0;continue;}
    for(const s of solids()){if(overlap(p,s)){p.life=0;puff(p.x,p.y,3,"#ffd23f",1.5);break;}}
    if(p.life&&inv<=0&&overlap(P,p)){p.life=0;loseLife();return;}}
  eproj=eproj.filter(p=>p.life>0);
  /* JEFE: EL GRAN SAJA */
  if(!lv.bonus){
    if(!boss&&P.x>lv.arena.trig){
      boss={x:lv.arena.bossX,y:GROUND-30,w:30,h:30,vx:0,vy:0,hp:10,maxhp:10,inv:0,t:0,onG:true,dead:false};
      lv.walls.push({x:lv.arena.wallX,y:GROUND-80,w:10,h:80,lockL:true});
      startMusic(2,156);sfx.roar();shake=8;}
    if(boss&&!boss.dead){
      boss.t++;if(boss.inv>0)boss.inv--;
      const agg=boss.hp<=5?1.35:1;
      if(boss.onG){boss.vx=Math.sign(P.x-boss.x)*0.4*agg;
        if(boss.t%Math.floor(150/agg)===0){boss.vy=-6.6;boss.onG=false;boss.vx=Math.sign(P.x-boss.x)*1.3*agg;sfx.roar();}}
      boss.vy+=0.42;boss.x+=boss.vx;boss.y+=boss.vy;
      boss.x=Math.max(lv.arena.wallX+12,Math.min(boss.x,2766-boss.w-4));
      if(boss.y+boss.h>=GROUND){boss.y=GROUND-boss.h;boss.vy=0;
        if(!boss.onG){boss.onG=true;sfx.thud();shake=6;
          const s=Math.sign(P.x-boss.x)||1,n=boss.hp<=5?3:2;
          for(let k=0;k<n;k++)eproj.push({x:boss.x+14,y:boss.y+4,vx:s*(0.7+k*0.4),vy:-2.3-k*0.3,g:0.08,w:5,h:5,life:240,note:1});}}
      for(const p of proj){if(overlap(p,boss)&&boss.inv<=0){p.life=0;boss.hp--;boss.inv=22;sfx.bosshit();puff(p.x,p.y,5,"#34e3ff",2);}}
      if(overlap(P,boss)){
        if(P.vy>0&&P.y+P.h-P.vy<=boss.y+6){P.vy=-6.5;P.jumps=1;   /* el pisoton siempre rebota */
          if(boss.inv<=0){boss.hp-=4;boss.inv=45;sfx.bosshit();shake=5;puff(boss.x+15,boss.y,10,"#ff3d77",3);}}
        else if(inv<=0&&boss.inv<=0){loseLife();return;}}
      if(boss.hp<=0){boss.dead=true;score+=300;sfx.win();shake=10;
        puff(boss.x+15,boss.y+12,26,"#ff3d77",4);puff(boss.x+15,boss.y+12,18,"#ffd23f",3.4);
        lv.walls=lv.walls.filter(w=>!w.gate&&!w.lockL);startMusic(0,140);}}
  }
  /* estrellas (cada una cuenta solo una vez por partida) */
  for(const st of lv.stars){if(st.got)continue;if(overlap(P,{x:st.x,y:st.y,w:8,h:8})){
    st.got=true;gotStars.add(st.k);score+=10;starsCount++;
    puff(st.x+4,st.y+4,5,"#ffd23f",1.8);
    if(starsCount%100===0)spawnLifeDrop();sfx.coin();}}
  /* notas musicales: pocas y positivas, cada una con su melodia */
  for(const n of lv.notes){if(n.got)continue;if(overlap(P,{x:n.x,y:n.y,w:9,h:10})){
    n.got=true;gotStars.add(n.k);score+=50;sfx.melody(n.m);
    puff(n.x+4,n.y+5,10,"#ffd23f",2.2);puff(n.x+4,n.y+5,5,"#fff7fb",1.6);}}
  /* 1UP que cae del cielo */
  for(const dr of drops){if(!dr.active)continue;
    dr.vy=Math.min(dr.vy+0.18,2.6);dr.y+=dr.vy;
    for(const s of solids()){if(overlap(dr,s)&&dr.vy>0&&dr.y+dr.h-dr.vy<=s.y+4){dr.y=s.y-dr.h;dr.vy=0;}}
    if(overlap(P,dr)){dr.active=false;lives++;sfx.life();puff(dr.x+4,dr.y+4,8,"#34e3ff",2.4);}
    if(dr.y>H+40)dr.active=false;}
  /* 1UP escondido del nivel */
  for(const it of lv.items){if(it.got)continue;if(overlap(P,{x:it.x,y:it.y,w:10,h:10})){
    it.got=true;lifeGot=true;lives++;sfx.life();puff(it.x+4,it.y+4,8,"#34e3ff",2.4);}}
  /* portales */
  if(lv.portal&&overlap(P,lv.portal)&&pr(["ArrowDown","KeyS"])){enterBonus();return;}
  if(lv.bonus&&overlap(P,lv.exit)){exitBonus();return;}
  /* particulas */
  for(const q of parts){q.vy+=0.12;q.x+=q.vx;q.y+=q.vy;q.life--;}
  parts=parts.filter(q=>q.life>0);
  /* camara (bloqueada en la arena del jefe) */
  if(boss&&!boss.dead)cam=lv.arena.camX;
  else cam=Math.max(0,Math.min(P.x-W/2,lv.len-W));
  if(!lv.bonus&&P.x>lv.goal)levelDone();
}
let checksDone=new Set();
function blinkChecks(){for(const c of lv.checks||[]){
  if(!checksDone.has(c.x)&&maxX>=c.x+20){checksDone.add(c.x);sfx.check();}}}
function loseLife(){if(dying>0)return;
  lives--;flash=8;stopMusic();sfx.hit();sfx.sad();dying=110;}
function afterDeath(){
  if(lives<=0){state="gameover";if(score>save.best){save.best=score;persist();}return;}
  if(lv.bonus){proj=[];eproj=[];cam=0;inv=40;newPlayer(lv.spawn);}
  else loadLevel();}
function levelDone(){if(score>save.best){save.best=score;persist();}sfx.win();stopMusic();state="worldclear";}

/* ====== render ====== */
function tile(s){
  ctx.fillStyle="#2a1a5e";ctx.fillRect(s.x,s.y,s.w,s.h);
  ctx.fillStyle="#4a2f8e";ctx.fillRect(s.x,s.y,s.w,4);
  ctx.fillStyle="#ff7ab0";ctx.fillRect(s.x,s.y,s.w,1);
  ctx.fillStyle="rgba(255,255,255,.05)";
  for(let x=s.x+6;x<s.x+s.w;x+=12)ctx.fillRect(x,s.y+4,1,s.h-4);
  for(let x=s.x+10;x<s.x+s.w-4;x+=28){
    ctx.fillStyle=(Math.floor(blink/22)+((x>>2)%2))%2?"#34e3ff":"#ff3d77";ctx.fillRect(x,s.y+2,2,1);}}
function fplat(s){
  if(s.dead)return;
  const sx=s.c&&s.ct>20?((blink*7)%3)-1:0;
  ctx.fillStyle=s.c?"#6e4a2e":"#c23a78";ctx.fillRect(s.x+sx,s.y,s.w,s.h);
  ctx.fillStyle=s.c?"#a8743f":"#ff7ab0";ctx.fillRect(s.x+sx,s.y,s.w,2);
  if(s.c){ctx.fillStyle="#3a2410";for(let x=s.x+6;x<s.x+s.w-2;x+=10)ctx.fillRect(x+sx,s.y+3,2,3);}}
function drawStar(cx,cy){ctx.fillStyle="#ffd23f";const p=[[0,-4],[1,-1],[4,-1],[1.5,1.2],[2.5,4],[0,1.7],[-2.5,4],[-1.5,1.2],[-4,-1],[-1,-1]];
  ctx.beginPath();p.forEach((q,i)=>{const X=cx+q[0],Y=cy+q[1];i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);});ctx.closePath();ctx.fill();
  if(Math.floor(blink/14)%3===0){ctx.fillStyle="#fff7fb";ctx.fillRect(cx-1,cy-1,2,2);}}
function drawSpikes(sp){
  ctx.fillStyle="#8ea0c8";
  for(let x=sp.x;x<sp.x+sp.w-3;x+=8){
    ctx.beginPath();ctx.moveTo(x,sp.y+sp.h);ctx.lineTo(x+4,sp.y);ctx.lineTo(x+8,sp.y+sp.h);ctx.closePath();ctx.fill();}
  ctx.fillStyle="#b9c7e8";ctx.fillRect(sp.x,sp.y+sp.h-2,sp.w,2);}
function drawCrusher(c){
  /* riel guia bien visible */
  ctx.fillStyle="rgba(255,61,119,.35)";ctx.fillRect(c.x+c.w/2-1,0,2,c.y);
  ctx.fillStyle="#b9c7e8";for(let y=8;y<c.y;y+=10)ctx.fillRect(c.x+c.w/2-1,y,2,4);
  /* halo de aviso */
  const warn=c.state===1||(c.state===0&&c.t<25);
  ctx.fillStyle=warn?"rgba(255,61,119,.30)":"rgba(255,61,119,.12)";
  ctx.fillRect(c.x-3,c.y-3,c.w+6,c.h+8);
  /* bloque con borde rosa y franjas de peligro */
  ctx.fillStyle="#ff3d77";ctx.fillRect(c.x-1,c.y-1,c.w+2,c.h+2);
  ctx.fillStyle="#241038";ctx.fillRect(c.x+1,c.y+1,c.w-2,c.h-2);
  ctx.fillStyle="#ffd23f";for(let x=c.x+2;x<c.x+c.w-4;x+=8)ctx.fillRect(x,c.y+2,4,3);
  ctx.fillStyle="#3d1a55";ctx.fillRect(c.x+3,c.y+7,c.w-6,c.h-10);
  /* ojos: cian en reposo, rojos al caer */
  ctx.fillStyle=warn?"#ff5a5a":"#34e3ff";
  ctx.fillRect(c.x+5,c.y+9,5,4);ctx.fillRect(c.x+c.w-10,c.y+9,5,4);
  ctx.fillStyle="#fff";ctx.fillRect(c.x+6,c.y+10,2,2);ctx.fillRect(c.x+c.w-9,c.y+10,2,2);
  ctx.fillStyle="#ff3d77";ctx.fillRect(c.x+8,c.y+16,c.w-16,2);
  /* puas plateadas */
  ctx.fillStyle="#d7e3f8";
  for(let x=c.x;x<c.x+c.w-3;x+=6){ctx.beginPath();ctx.moveTo(x,c.y+c.h);ctx.lineTo(x+3,c.y+c.h+5);ctx.lineTo(x+6,c.y+c.h);ctx.closePath();ctx.fill();}}
function drawWalker(e){const f=Math.floor(e.t/10)%2;
  ctx.fillStyle="#1c0f33";ctx.fillRect(e.x,e.y+5,e.w,e.h-7);          /* ala del sombrero */
  ctx.fillStyle="#241038";ctx.fillRect(e.x-2,e.y+3,e.w+4,2);
  ctx.fillStyle="#1c0f33";ctx.fillRect(e.x+3,e.y,e.w-6,4);
  ctx.fillStyle="#ff3d77";ctx.fillRect(e.x+2,e.y-2,2,3);ctx.fillRect(e.x+e.w-4,e.y-2,2,3); /* cuernos */
  ctx.fillStyle="#7b3ff2";ctx.fillRect(e.x+2,e.y+6,e.w-4,e.h-9);
  ctx.fillStyle="#ff3d77";ctx.fillRect(e.x+3,e.y+7,2,2);ctx.fillRect(e.x+e.w-5,e.y+7,2,2);
  ctx.fillStyle="#fff";ctx.fillRect(e.x+4,e.y+8,1,1);ctx.fillRect(e.x+e.w-4,e.y+8,1,1);
  ctx.fillStyle="#241038";
  ctx.fillRect(e.x+2+(f?1:0),e.y+e.h-2,3,2);ctx.fillRect(e.x+e.w-5-(f?1:0),e.y+e.h-2,3,2);}
function drawSpiny(e){
  ctx.fillStyle="#b9c7e8";
  for(let i=0;i<4;i++){const x=e.x+1+i*3;
    ctx.beginPath();ctx.moveTo(x,e.y+4);ctx.lineTo(x+1.5,e.y-1);ctx.lineTo(x+3,e.y+4);ctx.closePath();ctx.fill();}
  ctx.fillStyle="#241038";ctx.fillRect(e.x,e.y+4,e.w,e.h-4);
  ctx.fillStyle="#7b3ff2";ctx.fillRect(e.x+1,e.y+5,e.w-2,e.h-6);
  ctx.fillStyle="#ffd23f";ctx.fillRect(e.x+2,e.y+6,2,2);ctx.fillRect(e.x+e.w-4,e.y+6,2,2);
  ctx.fillStyle="#241038";ctx.fillRect(e.x+2,e.y+e.h-2,3,2);ctx.fillRect(e.x+e.w-5,e.y+e.h-2,3,2);}
function drawFlyer(e){const f=Math.floor(e.t/8)%2;
  ctx.fillStyle="#34e3ff";
  if(f){ctx.fillRect(e.x-3,e.y+1,4,2);ctx.fillRect(e.x+e.w-1,e.y+1,4,2);}
  else{ctx.fillRect(e.x-3,e.y-2,4,3);ctx.fillRect(e.x+e.w-1,e.y-2,4,3);}
  ctx.fillStyle="#d63bb0";ctx.fillRect(e.x+1,e.y,e.w-2,e.h-2);
  ctx.fillStyle="#ff9ad5";ctx.fillRect(e.x+2,e.y+1,e.w-4,3);
  ctx.fillStyle="#fff";ctx.fillRect(e.x+3,e.y+3,2,2);ctx.fillRect(e.x+e.w-5,e.y+3,2,2);
  ctx.fillStyle="#241038";ctx.fillRect(e.x+4,e.y+4,1,1);ctx.fillRect(e.x+e.w-4,e.y+4,1,1);}
function drawTurret(e){
  ctx.fillStyle="#1c0f33";ctx.fillRect(e.x,e.y,e.w,e.h);
  ctx.fillStyle="#2d1040";ctx.fillRect(e.x+1,e.y+1,e.w-2,e.h-2);
  const pulse=e.cd<30?Math.floor(blink/4)%2:0;
  ctx.fillStyle=pulse?"#ff3d77":"#7b3ff2";ctx.fillRect(e.x+3,e.y+3,e.w-6,e.w-6);
  ctx.fillStyle=pulse?"#ffd23f":"#34e3ff";ctx.fillRect(e.x+5,e.y+5,e.w-10,e.w-10);
  ctx.fillStyle="#241038";ctx.fillRect(e.x+2,e.y+e.h-3,3,3);ctx.fillRect(e.x+e.w-5,e.y+e.h-3,3,3);
  if(e.hp<2){ctx.fillStyle="#ffd23f";ctx.fillRect(e.x+2,e.y+1,2,1);ctx.fillRect(e.x+8,e.y+2,3,1);}}
function drawOrb(p){
  ctx.fillStyle="#241038";ctx.fillRect(p.x-1,p.y-1,7,7);
  ctx.fillStyle="#7b3ff2";ctx.fillRect(p.x,p.y,5,5);
  ctx.fillStyle=Math.floor(blink/6)%2?"#ff3d77":"#ff7ab0";ctx.fillRect(p.x+1,p.y+1,3,3);}
function drawNoteItem(n){
  ctx.fillStyle="rgba(255,210,63,"+(0.12+0.10*Math.sin(blink*0.15))+")";
  ctx.fillRect(n.x-3,n.y-4,16,17);                          /* halo pulsante */
  ctx.fillStyle="#ffd23f";
  ctx.fillRect(n.x,n.y+5,4,4);ctx.fillRect(n.x+5,n.y+6,4,4); /* doble corchea */
  ctx.fillRect(n.x+3,n.y-2,1,8);ctx.fillRect(n.x+8,n.y-1,1,8);
  ctx.fillRect(n.x+3,n.y-2,6,2);
  ctx.fillStyle="#fff7fb";ctx.fillRect(n.x+1,n.y+6,1,1);ctx.fillRect(n.x+6,n.y+7,1,1);}
function drawBoss(b){
  if(b.dead)return;
  if(b.inv>0&&Math.floor(b.inv/3)%2)return;
  const x=b.x,y=b.y;
  ctx.fillStyle="#1c0f33";ctx.fillRect(x-4,y+2,b.w+8,3);              /* ala del sombrero */
  ctx.fillRect(x+6,y-5,b.w-12,8);
  ctx.fillStyle="#ff3d77";ctx.fillRect(x+2,y-6,4,7);ctx.fillRect(x+b.w-6,y-6,4,7);  /* cuernos */
  ctx.fillRect(x+3,y-10,2,4);ctx.fillRect(x+b.w-5,y-10,2,4);
  ctx.fillStyle="#2d1040";ctx.fillRect(x,y+5,b.w,b.h-5);              /* cuerpo */
  ctx.fillStyle="#3d1a55";ctx.fillRect(x+2,y+7,b.w-4,b.h-12);
  ctx.fillStyle="#07030f";ctx.fillRect(x+4,y+9,b.w-8,8);              /* mascara */
  const ey=Math.floor(blink/40)%5===0?2:4;                            /* parpadeo malvado */
  ctx.fillStyle="#34e3ff";ctx.fillRect(x+7,y+11,5,ey);ctx.fillRect(x+b.w-12,y+11,5,ey);
  ctx.fillStyle="#fff";ctx.fillRect(x+8,y+12,2,1);ctx.fillRect(x+b.w-11,y+12,2,1);
  ctx.fillStyle="#ff3d77";ctx.fillRect(x+9,y+20,b.w-18,3);            /* boca */
  ctx.fillStyle="#fff7fb";for(let k=0;k<3;k++)ctx.fillRect(x+10+k*4,y+20,2,2);
  ctx.fillStyle="#1c0f33";ctx.fillRect(x+3,y+b.h-3,7,3);ctx.fillRect(x+b.w-10,y+b.h-3,7,3);}
function drawBossHP(b){
  ctx.fillStyle="#07030f";ctx.fillRect(W/2-52,22,104,9);
  ctx.fillStyle="#2a1a5e";ctx.fillRect(W/2-50,24,100,5);
  ctx.fillStyle="#ff3d77";ctx.fillRect(W/2-50,24,Math.max(0,100*b.hp/b.maxhp),5);
  ctx.fillStyle="#fff7fb";ctx.font="8px 'Courier New'";ctx.textAlign="center";
  ctx.fillText("EL GRAN SAJA",W/2,20);ctx.textAlign="left";}
function drawLife(x,y){ctx.fillStyle="#34e3ff";ctx.fillRect(x+1,y,3,3);ctx.fillRect(x+5,y,3,3);
  ctx.fillRect(x,y+2,9,3);ctx.fillRect(x+1,y+5,7,2);ctx.fillRect(x+3,y+7,3,2);
  ctx.fillStyle="#fff";ctx.font="6px 'Courier New'";ctx.textAlign="center";ctx.fillText("1UP",x+4,y-3);ctx.textAlign="left";}
function drawPortal(pt){ctx.fillStyle="#0a2a2a";ctx.fillRect(pt.x,pt.y,pt.w,pt.h);
  ctx.fillStyle="#1fbf9b";ctx.fillRect(pt.x,pt.y,pt.w,4);
  ctx.fillStyle="rgba(52,227,255,"+(0.4+0.4*Math.sin(blink*0.2))+")";ctx.fillRect(pt.x+3,pt.y+6,pt.w-6,pt.h-8);
  ctx.fillStyle="#bff";ctx.font="6px 'Courier New'";ctx.textAlign="center";ctx.fillText("↓",pt.x+pt.w/2,pt.y-2);ctx.textAlign="left";}
function drawCheck(c){const on=checksDone.has(c.x);
  ctx.fillStyle="#b9c7e8";ctx.fillRect(c.x,GROUND-26,2,26);
  ctx.fillStyle=on?"#34e3ff":"#3a2470";
  ctx.beginPath();ctx.moveTo(c.x+2,GROUND-26);ctx.lineTo(c.x+12,GROUND-22);ctx.lineTo(c.x+2,GROUND-18);ctx.closePath();ctx.fill();}
function drawGate(g){
  ctx.fillStyle="#1c0f33";ctx.fillRect(g.x,g.y,g.w,g.h);
  ctx.fillStyle="#7b3ff2";for(let y=g.y+4;y<g.y+g.h;y+=10)ctx.fillRect(g.x+2,y,g.w-4,3);
  ctx.fillStyle="#ff3d77";ctx.fillRect(g.x,g.y,g.w,2);}
function drawGoal(gx){ctx.fillStyle="#34e3ff";ctx.fillRect(gx,GROUND-150,4,150);
  ctx.fillStyle="#ff3d77";ctx.fillRect(gx-22,GROUND-150,46,18);ctx.fillStyle="#ffd23f";ctx.font="10px 'Courier New'";ctx.textAlign="center";
  ctx.fillText("META",gx,GROUND-137);ctx.textAlign="left";}
function ctext(t,y,size,col){ctx.fillStyle=col;ctx.font=size+"px 'Courier New'";ctx.textAlign="center";ctx.fillText(t,W/2,y);ctx.textAlign="left";}
function drawHUD(){
  for(let i=0;i<lives;i++){const hx=6+i*12,hy=6;ctx.fillStyle="#ff3d77";
    ctx.fillRect(hx+1,hy,3,3);ctx.fillRect(hx+5,hy,3,3);ctx.fillRect(hx,hy+2,9,3);ctx.fillRect(hx+1,hy+5,7,2);ctx.fillRect(hx+3,hy+7,3,2);}
  drawStar(124,10);
  ctx.fillStyle="#ffd23f";ctx.font="10px 'Courier New'";ctx.textAlign="left";
  ctx.fillText("x"+String(starsCount).padStart(3,"0"),132,14);
  ctx.fillStyle="#fff7fb";
  ctx.fillText("SCORE "+String(score).padStart(5,"0"),220,14);
  ctx.fillText(lv.bonus?"BONUS":"M1-1",W-60,14);}
function drawPlay(){
  drawBG();
  const sh=shake>0?Math.round((Math.random()-0.5)*shake):0;if(shake>0)shake--;
  ctx.save();ctx.translate(-Math.round(cam)+sh,0);
  ctx.fillStyle="rgba(255,61,119,.06)";
  for(let i=0;i<16;i++){const lx=120+i*230;
    ctx.beginPath();ctx.moveTo(lx,0);ctx.lineTo(lx-40,H);ctx.lineTo(lx+40,H);ctx.closePath();ctx.fill();}
  for(const s of lv.plats){if(s.h>10)tile(s);else fplat(s);}
  for(const s of lv.mov)fplat(s);
  for(const sp of lv.spikes)drawSpikes(sp);
  for(const c of lv.crushers)drawCrusher(c);
  for(const g of lv.walls)if(g.gate)drawGate(g);
  for(const c of lv.checks||[])drawCheck(c);
  if(lv.portal)drawPortal(lv.portal);
  if(lv.bonus)drawPortal(lv.exit);
  if(!lv.bonus)drawGoal(lv.goal);
  for(const st of lv.stars)if(!st.got)drawStar(st.x+4,st.y+4);
  for(const it of lv.items)if(!it.got)drawLife(it.x,it.y);
  for(const n of lv.notes)if(!n.got)drawNoteItem(n);
  for(const dr of drops)if(dr.active)drawLife(dr.x,dr.y);
  for(const e of lv.ene){if(!e.alive)continue;
    if(e.type==="w")drawWalker(e);else if(e.type==="s")drawSpiny(e);
    else if(e.type==="f")drawFlyer(e);else drawTurret(e);}
  if(boss)drawBoss(boss);
  for(const p of proj){ctx.fillStyle="#ff3d77";ctx.fillRect(p.x,p.y,p.w,p.h);ctx.fillStyle="#ffd23f";ctx.fillRect(p.x+1,p.y+1,2,2);}
  for(const p of eproj)drawOrb(p);
  if(!((inv>0&&Math.floor(inv/4)%2)||(dying>0&&dying%8<4))){
    const pose=!P.onGround?(P.vy<0?"jump":"fall"):(Math.abs(P.vx)>0.3?"run":"idle");
    drawIdol(P.x-1,P.y,P.d,P.face,1,spriteRows(pose,pose==="run"?Math.floor(P.animT/12):blink));
    if(P.fire>P.d.fire-7){ctx.fillStyle=SKIN;ctx.fillRect(P.face?P.x-4:P.x+P.w-1,P.y+8,4,2);}}
  for(const q of parts){ctx.fillStyle=q.col;ctx.globalAlpha=Math.min(1,q.life/14);ctx.fillRect(q.x,q.y,2,2);ctx.globalAlpha=1;}
  ctx.restore();drawHUD();
  if(boss&&!boss.dead)drawBossHP(boss);
  if(dying>0)ctx.fillStyle="rgba(7,3,15,"+(0.55*(1-dying/110))+")",ctx.fillRect(0,0,W,H);
  if(flash>0){ctx.fillStyle="rgba(255,0,60,"+(flash/30)+")";ctx.fillRect(0,0,W,H);flash--;}
  if(paused){ctx.fillStyle="rgba(8,4,24,.8)";ctx.fillRect(0,0,W,H);ctext("PAUSA",H/2,18,"#fff");}}
function drawTitle(){lv=null;boss=null;cam=blink*0.4;drawBGTitle();
  const ix=(W-9*34)/2+4;
  for(let i=0;i<9;i++)drawIdol(ix+i*34,158,idol(i),false,1);
  ctx.textAlign="center";ctx.fillStyle="#ff3d77";ctx.font="bold 48px 'Courier New'";ctx.fillText("K-PLAY",W/2,84);
  ctx.fillStyle="#34e3ff";ctx.font="13px 'Courier New'";ctx.fillText("NEON IDOL PLATFORMER",W/2,104);
  ctx.fillStyle="#b9a6ea";ctx.font="11px 'Courier New'";ctx.fillText("MEJOR "+String(save.best).padStart(5,"0"),W/2,122);
  if(Math.floor(blink/30)%2===0){ctx.fillStyle="#ffd23f";ctx.font="14px 'Courier New'";ctx.fillText("PULSA ENTER",W/2,228);}
  ctx.textAlign="left";}
function drawBGTitle(){grad("#241a52","#0c0726");bgStars(2);
  layer(BGS.far,0.15,(b,sx)=>{ctx.fillStyle="#150b2e";ctx.fillRect(sx,GROUND-58-b.h,b.w,b.h+58);});
  layer(BGS.mid,0.35,(b,sx)=>{ctx.fillStyle="#1f1444";ctx.fillRect(sx,GROUND-26-b.h,b.w,b.h+26);
    for(const wn of b.win){ctx.fillStyle=wn.c?"rgba(255,122,176,.5)":"rgba(52,227,255,.45)";
      ctx.fillRect(sx+wn.wx,GROUND-26-b.h+wn.wy,3,4);}});
  ctx.fillStyle="#1a1038";ctx.fillRect(0,GROUND,W,H-GROUND);}
function drawSelect(){drawBGTitle();
  ctext("ELIGE TU IDOL",34,16,"#fff7fb");
  const bx0=(W-9*34)/2;
  for(let i=0;i<9;i++){const bx=bx0+i*34,by=78;
    ctx.fillStyle=i===selIndex?"#ff3d77":"#2a1a5e";ctx.fillRect(bx-1,by-2,32,46);
    ctx.fillStyle="#140a2e";ctx.fillRect(bx+1,by,28,42);drawIdol(bx+8,by+3,idol(i),false,1.2);}
  const d=idol(selIndex);
  ctext((renaming?"> "+nameBuf+"_":d.name),168,16,"#ffd23f");
  ctext("vel "+d.move.toFixed(2)+"  salto "+(-d.jump).toFixed(1)+"  disparo "+(d.fire<=12?"rapido":"normal"),190,11,"#c9a0ff");
  ctext(renaming?"escribe el nombre y ENTER":"← →  elegir   ·   R renombrar   ·   ENTER jugar",224,12,"#34e3ff");}
function drawWorldClear(){grad("#102a52","#06121f");bgStars(7);
  const ix=(W-9*34)/2+4;
  for(let i=0;i<9;i++)drawIdol(ix+i*34,84,idol(i),false,1);
  ctext("¡NIVEL 1-1 COMPLETADO!",146,18,"#ffd23f");
  ctext("EL GRAN SAJA HA CAIDO",168,11,"#ff7ab0");
  ctext("SCORE FINAL "+String(score).padStart(5,"0"),190,14,"#34e3ff");
  ctext("ENTER para volver al inicio · mas niveles proximamente",224,11,"#ff3d77");}
function drawGameOver(){grad("#400f1f","#0c0306");bgStars(3);
  ctext("GAME OVER",112,32,"#ff3d77");ctext("SCORE "+String(score).padStart(5,"0"),156,14,"#fff");
  ctext("ENTER para reintentar",208,12,"#34e3ff");}

/* ====== renombrar ====== */
function handleRename(e){
  e.stopImmediatePropagation();   /* que el ENTER de confirmar no inicie la partida */
  if(e.key==="Enter"){if(nameBuf.trim())save.names[selIndex]=nameBuf.trim().slice(0,8).toUpperCase();persist();renaming=false;return;}
  if(e.key==="Escape"){renaming=false;return;}
  if(e.key==="Backspace"){nameBuf=nameBuf.slice(0,-1);return;}
  if(e.key.length===1&&/[a-zA-Z0-9 ]/.test(e.key)&&nameBuf.length<8)nameBuf+=e.key;}

/* ====== acciones de pantalla ====== */
addEventListener("keydown",e=>{
  if(renaming)return;
  if(e.code==="Enter"||e.code==="NumpadEnter"){initAudio();
    if(state==="title")state="select";
    else if(state==="select"){state="play";lives=3;score=0;starsCount=0;
      gotStars=new Set();checksDone=new Set();lifeGot=false;maxX=0;
      save.lastIdol=selIndex;persist();loadLevel();}
    else if(state==="worldclear")state="title";
    else if(state==="gameover")state="select";}
  if(state==="select"){
    if(e.code==="ArrowLeft"||e.code==="KeyA")selIndex=(selIndex+8)%9;
    if(e.code==="ArrowRight"||e.code==="KeyD")selIndex=(selIndex+1)%9;
    if(e.code==="KeyR"){renaming=true;nameBuf="";}}
});

/* controles UI */
const volEl=document.getElementById("vol"),muteEl=document.getElementById("mute");
volEl.value=Math.round(save.vol*100);muteEl.checked=save.muted;
volEl.addEventListener("input",()=>{save.vol=volEl.value/100;setVol();if(bgAudio)bgAudio.volume=save.muted?0:save.vol;persist();});
muteEl.addEventListener("change",()=>{save.muted=muteEl.checked;setVol();if(bgAudio)bgAudio.volume=save.muted?0:save.vol;persist();});

/* hook de depuracion */
window.__kp={tp(x){if(P){P.x=x;P.y=160;P.vy=0;maxX=Math.max(maxX,x);}},
  step(n){for(let i=0;i<n;i++){blink++;update();}},
  draw(){if(state==="play"){ctx.clearRect(0,0,W,H);drawPlay();}},
  key(c,v){keys[c]=v;},
  get(){return{state,lives,score,starsCount,px:P?P.x:0,py:P?P.y:0,vy:P?P.vy:0,
    og:P?P.onGround:false,dying,renaming,
    cr:lv&&lv.crushers&&lv.crushers[0]?{s:lv.crushers[0].state,y:Math.round(lv.crushers[0].y)}:null,
    notes:lv?lv.notes.filter(n=>n.got).length:0,
    paused,boss:boss?{hp:boss.hp,dead:boss.dead,bx:boss.x,by:boss.y}:null};}};

/* ====== bucle ====== */
function loop(){blink++;update();ctx.clearRect(0,0,W,H);
  if(state==="title")drawTitle();else if(state==="select")drawSelect();
  else if(state==="play")drawPlay();
  else if(state==="worldclear")drawWorldClear();else if(state==="gameover")drawGameOver();
  requestAnimationFrame(loop);}
loop();
})();
</script>
</body>
</html>
